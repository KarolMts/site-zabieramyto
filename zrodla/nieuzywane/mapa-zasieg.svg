<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa Polski z zaznaczoną Wielkopolską i miastami wokół Poznania">
  <!-- kontur Polski (uproszczony, na bazie realnych współrzędnych) -->
  <path d="M 28,101
           C 60,80 80,85 98,79
           C 130,60 170,38 196,32
           C 220,30 240,50 255,65
           C 270,74 282,80 294,81
           L 470,62
           L 506,69
           C 512,110 511,160 511,207
           C 525,260 540,310 540,353
           C 530,400 490,460 465,500
           C 430,505 380,480 326,484
           C 300,486 280,470 266,459
           C 240,440 220,410 206,394
           C 190,380 165,395 149,402
           C 120,395 90,370 66,340
           C 55,300 48,250 46,207
           C 44,170 30,130 28,101 Z"
        fill="#2c4a65" stroke="#f0ece1" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Wielkopolska — obszar działania -->
  <path d="M 170,148
           C 213,146 247,172 256,210
           C 266,250 252,292 220,313
           C 188,334 140,330 113,302
           C 88,275 84,228 102,196
           C 118,166 142,150 170,148 Z"

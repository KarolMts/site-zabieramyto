  <!-- legenda -->
  <g font-family="sans-serif" font-size="13" fill="#9aa7b5">
    <circle cx="360" cy="418" r="5" fill="#e8811f"/>
    <text x="372" y="423">baza: Poznań</text>
    <rect x="355" y="438" width="11" height="11" fill="#e8811f" fill-opacity="0.22" stroke="#e8811f" stroke-dasharray="4 3"/>
    <text x="372" y="448">obszar działania</text>
  </g>
</svg>

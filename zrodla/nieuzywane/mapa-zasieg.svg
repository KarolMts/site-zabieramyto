  <text x="88" y="140" font-family="sans-serif" font-size="15" font-weight="700" fill="#f2a052">WIELKOPOLSKA</text>

  <!-- miasta (rozmieszczenie poglądowe) -->
  <g font-family="sans-serif" font-size="12" fill="#f0ece1">
    <!-- Poznań -->
    <circle cx="172" cy="232" r="11" fill="#e8811f" fill-opacity="0.3"/>
    <circle cx="172" cy="232" r="6.5" fill="#e8811f"/>
    <text x="150" y="222" font-size="15" font-weight="700" fill="#fff">Poznań</text>

    <circle cx="126" cy="188" r="4" fill="#f2a052"/>
    <text x="78" y="180">Szamotuły</text>

    <circle cx="176" cy="174" r="4" fill="#f2a052"/>
    <text x="160" y="165">Oborniki</text>

    <circle cx="226" cy="186" r="4" fill="#f2a052"/>
    <text x="212" y="177">Gniezno</text>

    <circle cx="240" cy="243" r="4" fill="#f2a052"/>
    <text x="250" y="248">Września</text>

    <circle cx="205" cy="235" r="4" fill="#f2a052"/>
    <text x="212" y="227">Swarzędz</text>

    <circle cx="196" cy="266" r="4" fill="#f2a052"/>
